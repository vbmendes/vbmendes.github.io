<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>favicon</title>
<style>
  /* Fonte dos rasters do favicon: o SVG desenhado a 512px sobre nada. O Chrome
     recorta com fundo transparente por causa do --default-background-color.
     Ver "make favicon". */
  html, body { margin: 0; background: transparent; }
  img { display: block; width: 512px; height: 512px; }
</style>
</head>
<body>
<img src="/favicon.svg" alt="">
</body>
</html>
